[project]
name = "localcontrol"
version = "0.1.0"
description = "A terminal-based command center for managing multiple development projects"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.47.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "GitPython>=3.1.0",
    "toml>=0.10.2",
]

[project.scripts]
localcontrol = "main:run_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "*.py",
    "*.css",
    "config.py",
    "executor.py",
    "main.py",
    "port_mapper.py",
    "project_discovery.py",
    "spotify_control.py",
    "terminal_manager.py",
    "widgets.py",
    "main.css",
]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"main.css" = "main.css"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]
