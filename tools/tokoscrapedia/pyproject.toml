[project]
name = "tokoscrapedia"
version = "0.1.0"
description = "scrap tokopaedi merchant product review"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bs4>=0.0.2",
    "pandas>=2.3.2",
    "pyyaml>=6.0.2",
    "rich>=14.1.0",
    "selenium>=4.35.0",
]

[project.scripts]
tokoscrapedia = "tokoscrapedia.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokoscrapedia"]