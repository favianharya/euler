[project]
name = "safepass"
version = "1.0.0"
description = "Tool for make your password safe."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=45.0.5",
    "prompt-toolkit>=3.0.51",
    "pyyaml>=6.0.2",
    "questionary>=2.1.0",
    "rich>=14.1.0",
    "zxcvbn>=4.5.0",
]

[project.scripts]
safepass = "safepass.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safepass"]

[tool.hatch.build]
include = [
  "safepass/resource/*",
  "safepass/passwords.yaml",
  "safepass/secret.key",
]
